<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IA Clost — Lobby</title>
  <meta name="description" content="Lobby estilo oscuro" />
  <style>
    :root{
      --bg1:#0b0710;
      --bg2:#10071a;
      --panel:#0f1116;
      --muted:#b6b4bf;
      --white:#ffffff;
      --accent:#7b4bff;
      --accent2:#6b2cff;
      --glass: rgba(255,255,255,0.03);
      --border: rgba(255,255,255,0.06);
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:linear-gradient(180deg,#12041a 0%, #08060a 60%);color:var(--white)}
    .wrap{max-width:1200px;margin:18px auto;padding:0;border-radius:12px;overflow:hidden;display:flex;min-height:80vh;background:linear-gradient(180deg, rgba(6,6,10,0.6), rgba(6,6,8,0.3));box-shadow:0 30px 80px rgba(0,0,0,0.6)}
    .sidebar{width:280px;background:linear-gradient(180deg, rgba(8,8,10,0.8), rgba(6,6,8,0.6));padding:22px;border-right:1px solid var(--border)}
    .brand{display:flex;align-items:center;gap:12px;margin-bottom:18px}
    .logo{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#061021;font-weight:900}
    .brand span{font-weight:800}
    .menu{margin-top:6px;display:flex;flex-direction:column;gap:10px}
    .menu button{background:transparent;border:1px solid transparent;color:var(--muted);padding:10px 12px;border-radius:10px;text-align:left;cursor:pointer;font-weight:600}
    .menu button.active{background:linear-gradient(90deg, rgba(107,44,255,0.14), rgba(123,75,255,0.08));color:var(--white);border:1px solid rgba(107,44,255,0.12)}
    .sidebar .small{font-size:12px;color:var(--muted);margin-top:12px}
    .main{flex:1;padding:48px 64px;display:flex;flex-direction:column;gap:28px;align-items:center;justify-content:flex-start}
    .hero{width:100%;max-width:820px;text-align:center;padding-top:28px}
    .glow-wrap{width:88px;height:88px;margin:0 auto 24px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(180deg, rgba(124,73,255,0.06), rgba(107,44,255,0.02));box-shadow:0 8px 40px rgba(107,44,255,0.12), inset 0 0 28px rgba(124,73,255,0.06)}
    .glow-wrap .icon{width:56px;height:56px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,0.04)}
    .hero h1{font-size:clamp(2.2rem,5vw,3.4rem);margin:0 0 12px;font-weight:800;letter-spacing:-0.02em}
    .hero p{color:var(--muted);margin:0 0 22px;font-size:1rem}
    .hero .chips{display:flex;gap:12px;justify-content:center;margin-bottom:28px;flex-wrap:wrap}
    .chip{padding:10px 18px;border-radius:999px;border:1px solid rgba(255,255,255,0.03);color:var(--muted);background:transparent;font-weight:600}
    .search-box{width:100%;max-width:820px;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));border:1px solid rgba(255,255,255,0.04);border-radius:28px;padding:22px 20px;box-shadow:0 10px 40px rgba(0,0,0,0.6)}
    .search-row{display:flex;gap:12px;align-items:center}
    .search-row input{flex:1;padding:14px;border-radius:12px;border:1px solid rgba(255,255,255,0.03);background:transparent;color:var(--white);font-size:1rem}
    .search-row button{background:linear-gradient(90deg,var(--accent),var(--accent2));border:none;color:#041021;padding:12px 14px;border-radius:12px;font-weight:800;cursor:pointer}
    @media (max-width:900px){.wrap{flex-direction:column}.sidebar{width:100%;display:flex;flex-direction:row;gap:12px;overflow:auto;padding:14px}.main{padding:24px}.hero h1{font-size:2rem}}
  </style>
</head>
<body>
  <div class="wrap" role="main">
    <aside class="sidebar" aria-label="menu">
      <div class="brand">
        <div class="logo">AI</div>
        <span>Clost AI</span>
      </div>

      <nav class="menu" aria-label="herramientas">
        <button>Chat</button>
        <button>Traductor</button>
        <button>Analizar foto</button>
        <button>Generar imágenes</button>
        <button class="active">Lobby</button>
        <button>Ayuda</button>
      </nav>

      <div class="small">Historial — 1/80 • Búsquedas 1/30</div>
    </aside>

    <section class="main">
      <div class="hero" aria-hidden="false">
        <div class="glow-wrap" aria-hidden="true">
          <div class="icon">
            <img src="assets/planet.png" alt="planeta" style="width:48px;height:48px;object-fit:contain"/>
          </div>
        </div>

        <h1>Hola, ¿qué quieres saber?</h1>
        <p>Respuestas actualizadas y útiles — comprueba siempre la información.</p>

        <div class="chips" role="list">
          <div class="chip">Noticias de tecnología</div>
          <div class="chip">¿Qué tiempo hará hoy?</div>
        </div>

        <div class="search-box" aria-label="buscador">
          <div style="color:var(--muted);margin-bottom:8px">¿Qué quieres preguntar?</div>
          <div class="search-row">
            <input placeholder="Escribe tu pregunta..." aria-label="pregunta"/>
            <button aria-label="enviar">→</button>
          </div>
        </div>
      </div>
    </section>
  </div>
</body>
</html>
